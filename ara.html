<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ara · Nexora AI</title>
  <meta name="description" content="BIST ve global hisselerde hızlı arama — kart veya AI analiz." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #060a12; --panel: rgba(15,23,42,.92); --border: rgba(148,163,184,.12);
      --text: #f1f5f9; --muted: #94a3b8; --dim: #64748b; --accent: #10b981; --cyan: #22d3ee;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; color: inherit; border: none; background: none; }

    .nav {
      height: 56px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; border-bottom: 1px solid var(--border);
      background: rgba(6,10,18,.92); position: sticky; top: 0; z-index: 20;
    }
    .brand { font-weight: 800; }
    .brand em { font-style: normal; color: var(--accent); }
    .nav a.back { font-size: 13px; font-weight: 600; color: var(--muted); }

    .wrap { max-width: 640px; margin: 0 auto; padding: 28px 16px 48px; }

    h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.03em; }
    h1 span {
      background: linear-gradient(90deg, var(--accent), var(--cyan));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .sub { color: var(--muted); font-size: 14px; margin: 8px 0 20px; }

    .search-box {
      display: flex; gap: 8px; flex-wrap: wrap;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .search-box input {
      flex: 1; min-width: 160px;
      background: rgba(30,41,59,.9);
      box-shadow: inset 0 0 0 1px var(--border);
      border-radius: 11px;
      padding: 12px 14px;
      outline: none;
      font-size: 15px;
    }
    .search-box input:focus { box-shadow: inset 0 0 0 1px rgba(16,185,129,.45); }
    .search-box select {
      background: rgba(30,41,59,.9);
      box-shadow: inset 0 0 0 1px var(--border);
      border-radius: 11px;
      padding: 12px 12px;
      cursor: pointer;
    }

    .list { display: flex; flex-direction: column; gap: 8px; }
    .row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; flex-wrap: wrap;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      transition: border-color .15s;
    }
    .row:hover { border-color: rgba(16,185,129,.35); }
    .sym { font-weight: 800; font-size: 15px; }
    .name { color: var(--muted); font-size: 12.5px; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; padding: 8px 12px; border-radius: 9px;
      font-size: 12.5px; font-weight: 700; cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #059669);
      color: #022c22;
    }
    .btn-soft {
      background: rgba(30,41,59,.95);
      box-shadow: inset 0 0 0 1px var(--border);
      color: var(--text);
    }

    .empty {
      text-align: center; color: var(--dim); padding: 32px 12px;
      border: 1px dashed var(--border); border-radius: 14px; font-size: 14px;
    }
    .hint { font-size: 12.5px; color: var(--dim); margin-top: 16px; line-height: 1.6; }

    footer {
      text-align: center; font-size: 12px; color: var(--dim); padding: 12px 16px 32px;
    }
    footer a { color: var(--muted); margin: 0 5px; font-weight: 600; }
  </style>
</head>
<body>
  <nav class="nav">
    <a class="brand" href="index.html">Nexora <em>AI</em></a>
    <a class="back" href="index.html">← Ana sayfa</a>
  </nav>

  <main class="wrap">
    <h1>Hisse <span>ara</span></h1>
    <p class="sub">THYAO, EREGL, Apple… Yaz, karta veya AI analize git.</p>

    <div class="search-box">
      <input id="q" type="search" placeholder="Sembol veya şirket adı" autocomplete="off" autofocus />
      <select id="mkt">
        <option value="bist">BIST</option>
        <option value="nasdaq">NASDAQ</option>
        <option value="nyse">NYSE</option>
      </select>
    </div>

    <div class="list" id="list">
      <div class="empty">Aramaya başla — en az 1 karakter</div>
    </div>

    <p class="hint">
      Sonuçlar <code style="color:var(--cyan)">data/{piyasa}.json</code> içinden gelir.
      Canlı fiyat için <a href="stock.html" style="color:var(--cyan)">Hisseler</a> detayına geç.
    </p>
  </main>

  <footer>
    <a href="stock.html">Hisseler</a>
    <a href="ai-analiz.html">AI Analiz</a>
    <a href="kvkk.html">KVKK</a>
    <a href="gizlilik.html">Gizlilik</a>
  </footer>

  <script>
(function () {
  "use strict";

  var cache = {};
  var timer = null;

  async function load(m) {
    if (cache[m]) return cache[m];
    var res = await fetch("data/" + m + ".json", { cache: "no-store" });
    if (!res.ok) throw new Error("JSON yok");
    var data = await res.json();
    cache[m] = Array.isArray(data) ? data : data.stocks || [];
    return cache[m];
  }

  function row(s, m) {
    var stockUrl =
      "stock.html?market=" + encodeURIComponent(m) +
      "&symbol=" + encodeURIComponent(s.symbol);
    var aiUrl =
      "ai-analiz.html?symbol=" + encodeURIComponent(s.symbol) +
      "&market=" + encodeURIComponent(m);
    return (
      '<div class="row">' +
        "<div>" +
          '<div class="sym">' + (s.flag || "") + " " + s.symbol + "</div>" +
          '<div class="name">' + (s.name || "") +
          (s.sector ? " · " + s.sector : "") + "</div>" +
        "</div>" +
        '<div class="actions">' +
          '<a class="btn btn-primary" href="' + stockUrl + '">Kart</a>' +
          '<a class="btn btn-soft" href="' + aiUrl + '">AI</a>' +
          '<a class="btn btn-soft" href="portfolio.html?add=' +
            encodeURIComponent(s.symbol) + "&market=" + encodeURIComponent(m) +
          '">Portföy</a>' +
        "</div>" +
      "</div>"
    );
  }

  async function run() {
    var q = (document.getElementById("q").value || "").trim().toLowerCase();
    var m = document.getElementById("mkt").value;
    var box = document.getElementById("list");

    if (!q) {
      box.innerHTML = '<div class="empty">Aramaya başla — en az 1 karakter</div>';
      return;
    }

    box.innerHTML = '<div class="empty">Aranıyor…</div>';
    try {
      var stocks = await load(m);
      var hits = stocks
        .filter(function (s) {
          return (
            String(s.symbol).toLowerCase().indexOf(q) !== -1 ||
            String(s.name || "").toLowerCase().indexOf(q) !== -1 ||
            String(s.sector || "").toLowerCase().indexOf(q) !== -1
          );
        })
        .slice(0, 30);

      if (!hits.length) {
        box.innerHTML = '<div class="empty">Sonuç yok</div>';
        return;
      }
      box.innerHTML = hits.map(function (s) { return row(s, m); }).join("");
    } catch (e) {
      box.innerHTML =
        '<div class="empty">data/' + m + ".json yüklenemedi</div>";
    }
  }

  document.getElementById("q").addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(run, 180);
  });
  document.getElementById("mkt").addEventListener("change", run);

  var params = new URLSearchParams(location.search);
  if (params.get("q")) {
    document.getElementById("q").value = params.get("q");
  }
  if (params.get("market")) {
    var sel = document.getElementById("mkt");
    var m = params.get("market").toLowerCase();
    if ([].some.call(sel.options, function (o) { return o.value === m; })) {
      sel.value = m;
    }
  }
  if (document.getElementById("q").value) run();
})();

</script>
</body>
</html>
