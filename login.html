<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş | BIST AI Tracker</title>
<meta name="description" content="BIST AI Tracker — Nexora hesabınla giriş yap.">
<meta name="theme-color" content="#0a0e17">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #0a0e17;
  --border: rgba(255,255,255,0.06);
  --text: #f1f5f9;
  --muted: #94a3b8;
  --accent: #10b981;
  --cyan: #22d3ee;
  --violet: #a78bfa;
  --amber: #fbbf24;
  --red: #ef4444;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
}
a { color: inherit; text-decoration: none; }
button, input { font-family: inherit; }
button { cursor: pointer; border: none; background: none; }

.bg-glow {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 20%, rgba(16,185,129,0.12), transparent),
    radial-gradient(ellipse 50% 35% at 80% 70%, rgba(167,139,250,0.1), transparent);
}

.navbar {
  position: relative; z-index: 10; height: 60px;
  border-bottom: 1px solid var(--border);
  background: rgba(10,14,23,0.75);
  backdrop-filter: blur(16px);
}
.nav-inner {
  max-width: 1100px; margin: 0 auto; padding: 0 20px;
  height: 60px; display: flex; align-items: center; justify-content: space-between;
}
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; }
.logo .accent { color: var(--accent); }
.nav-links { display: flex; gap: 18px; font-size: 13.5px; font-weight: 500; color: var(--muted); }
.nav-links a:hover { color: var(--accent); }

.main {
  position: relative; z-index: 1;
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 40px 20px;
}

.auth-card {
  width: 100%; max-width: 420px;
  background: rgba(17,24,39,0.88);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 32px 28px 28px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.4);
}

.auth-header { text-align: center; margin-bottom: 26px; }
.auth-header .icon {
  width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 16px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, rgba(16,185,129,0.2), rgba(34,211,238,0.15));
  border: 1px solid rgba(16,185,129,0.25);
  font-size: 24px;
}
.auth-header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; }
.auth-header p { font-size: 13.5px; color: var(--muted); }

.tabs {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  background: rgba(15,23,42,0.8); border-radius: 12px; padding: 4px;
  margin-bottom: 22px; border: 1px solid var(--border);
}
.tabs button {
  padding: 10px; border-radius: 10px; font-size: 13.5px; font-weight: 600;
  color: var(--muted); transition: all 0.2s;
}
.tabs button.active {
  background: rgba(16,185,129,0.15);
  color: var(--accent);
  border: 1px solid rgba(16,185,129,0.3);
}

.form-panel { display: none; }
.form-panel.active { display: block; }

.field { margin-bottom: 14px; }
.field label {
  display: block; font-size: 12px; font-weight: 600;
  color: #94a3b8; margin-bottom: 6px;
}
.field-wrap { position: relative; }
.field-wrap i.left {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: #64748b; font-size: 13px; pointer-events: none;
}
.field-wrap input {
  width: 100%; padding: 12px 42px 12px 40px;
  border-radius: 11px; background: rgba(15,23,42,0.95);
  border: 1px solid #334155; color: var(--text);
  font-size: 14px; outline: none;
}
.field-wrap input:focus { border-color: rgba(16,185,129,0.5); }
.field-wrap .toggle-pw {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  color: #64748b; font-size: 13px; padding: 4px;
}
.field-wrap .toggle-pw:hover { color: var(--accent); }

.row-between {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px; font-size: 12.5px;
}
.row-between label {
  display: flex; align-items: center; gap: 8px; color: #94a3b8; cursor: pointer;
}
.row-between input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }
.row-between a { color: var(--accent); font-weight: 500; }
.row-between a:hover { text-decoration: underline; }

.btn-submit {
  width: 100%; padding: 13px; border-radius: 12px;
  font-size: 14px; font-weight: 700;
  background: linear-gradient(135deg, #10b981, #059669);
  color: #022c22;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-submit:hover { box-shadow: 0 10px 28px rgba(16,185,129,0.35); }
.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

.divider {
  display: flex; align-items: center; gap: 12px;
  margin: 18px 0; color: #64748b; font-size: 12px;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

.btn-ghost {
  width: 100%; padding: 12px; border-radius: 12px;
  font-size: 13.5px; font-weight: 600;
  background: rgba(30,41,59,0.8); border: 1px solid var(--border);
  color: #e2e8f0;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.btn-ghost:hover { border-color: rgba(16,185,129,0.35); }

.msg {
  display: none; padding: 11px 14px; border-radius: 10px;
  font-size: 13px; font-weight: 500; margin-bottom: 14px;
}
.msg.show { display: block; }
.msg.error { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.25); color: #fca5a5; }
.msg.ok { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.25); color: #6ee7b7; }

.strength {
  height: 3px; border-radius: 2px; background: #1e293b; margin-top: 8px; overflow: hidden;
}
.strength span {
  display: block; height: 100%; width: 0; transition: width 0.25s, background 0.25s;
}

.footer-links {
  margin-top: 20px; text-align: center; font-size: 13px; color: #94a3b8;
}
.footer-links a { color: var(--accent); font-weight: 600; }

.footer {
  position: relative; z-index: 1;
  text-align: center; padding: 20px; font-size: 12px; color: #64748b;
  border-top: 1px solid var(--border);
}
</style>
</head>
<body>
<div class="bg-glow"></div>

<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="logo"><span>📈</span> BIST <span class="accent">AI</span> Tracker</a>
    <div class="nav-links">
      <a href="index.html">Ana Sayfa</a>
      <a href="register.html">Kayıt Ol</a>
    </div>
  </div>
</nav>

<main class="main">
  <div class="auth-card">
    <div class="auth-header">
      <div class="icon">🔐</div>
      <h1 id="titleText">Hoş geldiniz</h1>
      <p id="subText">Nexora hesabınla devam et</p>
    </div>

    <div class="tabs">
      <button type="button" class="active" data-tab="login">Giriş</button>
      <button type="button" data-tab="register">Kayıt Ol</button>
    </div>

    <div class="msg" id="msg"></div>

    <!-- LOGIN -->
    <div class="form-panel active" id="panel-login">
      <form id="formLogin" autocomplete="on">
        <div class="field">
          <label for="loginEmail">E-posta</label>
          <div class="field-wrap">
            <i class="fas fa-envelope left"></i>
            <input type="email" id="loginEmail" placeholder="ornek@email.com" required autocomplete="email">
          </div>
        </div>
        <div class="field">
          <label for="loginPass">Şifre</label>
          <div class="field-wrap">
            <i class="fas fa-lock left"></i>
            <input type="password" id="loginPass" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="toggle-pw" data-target="loginPass" aria-label="Göster"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div class="row-between">
          <label><input type="checkbox" id="rememberMe" checked> Beni hatırla</label>
          <a href="#" id="forgotLink">Şifremi unuttum</a>
        </div>
        <button type="submit" class="btn-submit" id="btnLogin">
          <i class="fas fa-sign-in-alt"></i> Giriş Yap
        </button>
      </form>
      <div class="divider">veya</div>
      <button type="button" class="btn-ghost" id="btnGuest">
        <i class="fas fa-user"></i> Misafir olarak devam et
      </button>
      <div class="footer-links" style="margin-top:16px">
        Hesabın yok mu? <a href="register.html">Ücretsiz kayıt ol</a>
      </div>
    </div>

    <!-- REGISTER -->
    <div class="form-panel" id="panel-register">
      <form id="formRegister" autocomplete="on">
        <div class="field">
          <label for="regName">Ad Soyad</label>
          <div class="field-wrap">
            <i class="fas fa-user left"></i>
            <input type="text" id="regName" placeholder="Adınız Soyadınız" required minlength="2" autocomplete="name">
          </div>
        </div>
        <div class="field">
          <label for="regEmail">E-posta</label>
          <div class="field-wrap">
            <i class="fas fa-envelope left"></i>
            <input type="email" id="regEmail" placeholder="ornek@email.com" required autocomplete="email">
          </div>
        </div>
        <div class="field">
          <label for="regPass">Şifre</label>
          <div class="field-wrap">
            <i class="fas fa-lock left"></i>
            <input type="password" id="regPass" placeholder="En az 6 karakter" required minlength="6" autocomplete="new-password">
            <button type="button" class="toggle-pw" data-target="regPass" aria-label="Göster"><i class="fas fa-eye"></i></button>
          </div>
          <div class="strength"><span id="strengthBar"></span></div>
        </div>
        <div class="field">
          <label for="regPass2">Şifre Tekrar</label>
          <div class="field-wrap">
            <i class="fas fa-lock left"></i>
            <input type="password" id="regPass2" placeholder="Tekrar yazın" required minlength="6" autocomplete="new-password">
          </div>
        </div>
        <div class="row-between">
          <label><input type="checkbox" id="acceptTerms" required> Şartları kabul ediyorum</label>
        </div>
        <button type="submit" class="btn-submit" id="btnRegister">
          <i class="fas fa-user-plus"></i> Hesap Oluştur
        </button>
      </form>
      <div class="footer-links">
        Zaten üye misin? <a href="#" id="gotoLogin">Giriş yap</a>
        · <a href="register.html">Detaylı kayıt sayfası</a>
      </div>
    </div>
  </div>
</main>

<footer class="footer">© 2026 BIST AI Tracker · Nexora AI</footer>

<script>

/* ===== Supabase — kendi URL / KEY ===== */
var SUPABASE_URL = 'https://ckxgbmvjehshgicafsjp.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_J370jM_6LUMXGfwGfbWK0Q_nR0I6NA2';
/* ===================================== */

var supabaseClient = null;
try {
  if (typeof supabase !== 'undefined' && supabase.createClient &&
      SUPABASE_URL && SUPABASE_URL.indexOf('XXXXXXXX') === -1 &&
      SUPABASE_ANON_KEY && SUPABASE_ANON_KEY.length > 40 &&
      SUPABASE_ANON_KEY.indexOf('BURAYA_ANON_KEY') === -1) {
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch (e) {}

function showMsg(text, type) {
  var el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg show ' + (type || 'error');
}
function hideMsg() { document.getElementById('msg').className = 'msg'; }

function saveLocalSession(user) {
  try {
    var sess = {
      id: user.id,
      email: user.email || '',
      name: (user.user_metadata && user.user_metadata.full_name) || user.email || '',
      plan: (user.user_metadata && user.user_metadata.plan) || 'free',
      at: Date.now()
    };
    localStorage.setItem('nexora_session', JSON.stringify(sess));
    localStorage.setItem('nexora_plan', sess.plan);
  } catch (e) {}
}

/* Sekmeler */
document.querySelectorAll('.tabs button').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.tabs button').forEach(function(b){ b.classList.remove('active'); });
    document.querySelectorAll('.form-panel').forEach(function(p){ p.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('panel-' + btn.getAttribute('data-tab')).classList.add('active');
    hideMsg();
    if (btn.getAttribute('data-tab') === 'login') {
      document.getElementById('titleText').textContent = 'Hoş geldiniz';
      document.getElementById('subText').textContent = 'Nexora hesabınla devam et';
    } else {
      document.getElementById('titleText').textContent = 'Hesap oluştur';
      document.getElementById('subText').textContent = 'Ücretsiz plan ile hemen başla';
    }
  });
});
var gotoLogin = document.getElementById('gotoLogin');
if (gotoLogin) {
  gotoLogin.addEventListener('click', function(e) {
    e.preventDefault();
    document.querySelector('.tabs button[data-tab="login"]').click();
  });
}

/* Şifre göster */
document.querySelectorAll('.toggle-pw').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var inp = document.getElementById(btn.getAttribute('data-target'));
    if (!inp) return;
    var show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    btn.innerHTML = show ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
  });
});

/* Şifre gücü */
var regPass = document.getElementById('regPass');
if (regPass) {
  regPass.addEventListener('input', function() {
    var p = this.value, score = 0;
    if (p.length >= 6) score++;
    if (p.length >= 10) score++;
    if (/[A-Z]/.test(p) && /[a-z]/.test(p)) score++;
    if (/\d/.test(p)) score++;
    if (/[^A-Za-z0-9]/.test(p)) score++;
    var bar = document.getElementById('strengthBar');
    if (!bar) return;
    bar.style.width = Math.min(100, score * 20) + '%';
    bar.style.background = score < 2 ? '#ef4444' : score < 4 ? '#f59e0b' : '#10b981';
  });
}

/* GİRİŞ */
document.getElementById('formLogin').addEventListener('submit', async function(e) {
  e.preventDefault();
  hideMsg();
  if (!supabaseClient) {
    showMsg('Bağlantı hatası. Daha sonra tekrar dene.', 'error');
    return;
  }
  var email = document.getElementById('loginEmail').value.trim();
  var pass = document.getElementById('loginPass').value;
  var btn = document.getElementById('btnLogin');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Giriş yapılıyor…';

  try {
    var res = await supabaseClient.auth.signInWithPassword({ email: email, password: pass });
    if (res.error) throw res.error;
    saveLocalSession(res.data.user);
    showMsg('Giriş başarılı. Yönlendiriliyorsun…', 'ok');
    setTimeout(function(){ location.href = 'index.html'; }, 600);
  } catch (err) {
    showMsg(err.message || 'E-posta veya şifre hatalı.', 'error');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Giriş Yap';
  }
});

/* KAYIT */
document.getElementById('formRegister').addEventListener('submit', async function(e) {
  e.preventDefault();
  hideMsg();
  if (!supabaseClient) {
    showMsg('Bağlantı hatası. Daha sonra tekrar dene.', 'error');
    return;
  }
  var name = document.getElementById('regName').value.trim();
  var email = document.getElementById('regEmail').value.trim();
  var pass = document.getElementById('regPass').value;
  var pass2 = document.getElementById('regPass2').value;
  var btn = document.getElementById('btnRegister');

  if (pass.length < 6) { showMsg('Şifre en az 6 karakter olmalı.', 'error'); return; }
  if (pass !== pass2) { showMsg('Şifreler eşleşmiyor.', 'error'); return; }
  if (!document.getElementById('acceptTerms').checked) {
    showMsg('Şartları kabul edin.', 'error'); return;
  }

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Kayıt yapılıyor…';

  try {
    var res = await supabaseClient.auth.signUp({
      email: email,
      password: pass,
      options: { data: { full_name: name, plan: 'free' } }
    });
    if (res.error) throw res.error;

    if (res.data.user && res.data.session) {
      saveLocalSession(res.data.user);
      showMsg('Hesap oluşturuldu. Yönlendiriliyorsun…', 'ok');
      setTimeout(function(){ location.href = 'index.html'; }, 700);
    } else {
      showMsg('Kayıt alındı. E-postadaki doğrulama linkine tıkla, sonra giriş yap.', 'ok');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-user-plus"></i> Hesap Oluştur';
      document.querySelector('.tabs button[data-tab="login"]').click();
    }
  } catch (err) {
    var m = err.message || 'Kayıt başarısız.';
    if (/already|registered|exists/i.test(m)) m = 'Bu e-posta zaten kayıtlı. Giriş yap.';
    showMsg(m, 'error');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-user-plus"></i> Hesap Oluştur';
  }
});

/* Şifremi unuttum */
document.getElementById('forgotLink').addEventListener('click', async function(e) {
  e.preventDefault();
  if (!supabaseClient) {
    showMsg('Bağlantı hatası.', 'error');
    return;
  }
  var email = document.getElementById('loginEmail').value.trim();
  if (!email) {
    showMsg('Önce e-posta adresini yaz.', 'error');
    return;
  }
  try {
    var res = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/login.html'
    });
    if (res.error) throw res.error;
    showMsg('Sıfırlama linki e-postana gönderildi.', 'ok');
  } catch (err) {
    showMsg(err.message || 'İstek gönderilemedi.', 'error');
  }
});

/* Misafir */
document.getElementById('btnGuest').addEventListener('click', function() {
  try {
    localStorage.setItem('nexora_session', JSON.stringify({
      id: 'guest', email: '', name: 'Misafir', plan: 'free', at: Date.now()
    }));
    localStorage.setItem('nexora_plan', 'free');
  } catch (e) {}
  location.href = 'index.html';
});

/* Oturum açıksa bilgi */
if (supabaseClient) {
  supabaseClient.auth.getSession().then(function(res) {
    if (res.data && res.data.session && res.data.session.user) {
      saveLocalSession(res.data.session.user);
      document.getElementById('subText').textContent =
        'Oturum açık: ' + (res.data.session.user.email || '');
    }
  });
}
</script>
</body>
</html>
