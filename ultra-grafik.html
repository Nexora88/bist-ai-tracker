<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ultra Grafik · Nexora AI</title>
  <meta name="theme-color" content="#0d0d1a" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0d1a; --panel: rgba(18,18,32,.96); --border: rgba(148,163,184,.14);
      --text: #f8fafc; --muted: #cbd5e1; --dim: #94a3b8; --faint: #64748b;
      --cyan: #00f0ff; --up: #34d399; --down: #f87171;
      --grad: linear-gradient(135deg,#00f0ff,#007bff 50%,#7b2cff);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; color: inherit; border: none; background: none; }
    button { cursor: pointer; }
    .nav {
      height: 56px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; background: rgba(13,13,26,.92); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 20;
    }
    .brand { font-weight: 800; font-size: 14px; display: flex; gap: 8px; align-items: center; }
    .mark {
      width: 28px; height: 28px; border-radius: 8px; background: var(--grad);
      display: grid; place-items: center; font-size: 11px; font-weight: 900; color: #0d0d1a;
    }
    .brand em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .nav a.x { padding: 8px 12px; border-radius: 9px; font-size: 12px; font-weight: 700; box-shadow: inset 0 0 0 1px var(--border); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 16px 14px 48px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
    .search {
      flex: 1; min-width: 150px; display: flex; padding: 10px 12px; border-radius: 12px;
      background: rgba(6,6,15,.75); box-shadow: inset 0 0 0 1px var(--border);
    }
    .search input { flex: 1; font-size: 15px; font-weight: 700; text-transform: uppercase; outline: none; }
    .go {
      padding: 10px 16px; border-radius: 11px; font-weight: 800; font-size: 13px;
      color: #0d0d1a; background: var(--grad);
    }
    .go:disabled { opacity: .5; cursor: not-allowed; }
    .ranges { display: flex; flex-wrap: wrap; gap: 6px; }
    .ranges button {
      padding: 8px 12px; border-radius: 999px; font-size: 12px; font-weight: 700;
      color: var(--dim); background: var(--panel); box-shadow: inset 0 0 0 1px var(--border);
    }
    .ranges button.on { color: #0d0d1a; background: var(--grad); box-shadow: none; }
    .kpi { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    @media (min-width: 640px) { .kpi { grid-template-columns: repeat(4, 1fr); } }
    .kpi-card { padding: 12px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--border); }
    .kpi-card .l { font-size: 11px; font-weight: 700; color: var(--faint); text-transform: uppercase; }
    .kpi-card .v { margin-top: 4px; font-size: 1.15rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .kpi-card .v.up { color: var(--up); } .kpi-card .v.down { color: var(--down); }
    .kpi-card .s { margin-top: 2px; font-size: 11px; color: var(--dim); font-weight: 600; }
    .shell {
      position: relative; border-radius: 16px; border: 1px solid var(--border);
      background: #0a0a14; overflow: hidden; min-height: 380px;
    }
    #chart { width: 100%; height: min(58vh, 520px); min-height: 360px; }
    .overlay {
      position: absolute; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px; padding: 24px;
      text-align: center; background: rgba(13,13,26,.88); z-index: 5;
    }
    .overlay.show { display: flex; }
    .overlay .t { font-size: 15px; font-weight: 800; }
    .overlay .m { font-size: 13px; color: var(--dim); max-width: 36ch; line-height: 1.55; }
    .spin {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid rgba(0,240,255,.15); border-top-color: var(--cyan);
      animation: sp .7s linear infinite;
    }
    @keyframes sp { to { transform: rotate(360deg); } }
    .note {
      margin-top: 14px; padding: 12px 14px; border-radius: 12px;
      background: var(--panel); border: 1px solid var(--border);
      font-size: 12.5px; color: var(--dim); line-height: 1.55;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a class="brand" href="index.html"><span class="mark">N</span> Nexora <em>Grafik</em></a>
    <a class="x" href="stock.html">Hisseler</a>
  </nav>

  <main class="wrap">
    <div class="toolbar">
      <div class="search">
        <input id="sym" type="text" placeholder="THYAO, AAPL…" autocomplete="off" spellcheck="false" />
      </div>
      <button type="button" class="go" id="btn">Yükle</button>
      <div class="ranges" id="ranges">
        <button type="button" data-r="1d">1G</button>
        <button type="button" data-r="5d">5G</button>
        <button type="button" data-r="1mo">1A</button>
        <button type="button" data-r="3mo" class="on">3A</button>
        <button type="button" data-r="6mo">6A</button>
        <button type="button" data-r="1y">1Y</button>
        <button type="button" data-r="5y">5Y</button>
      </div>
    </div>

    <div class="kpi">
      <div class="kpi-card"><div class="l">Sembol</div><div class="v" id="kSym">—</div><div class="s" id="kSrc">—</div></div>
      <div class="kpi-card"><div class="l">Son</div><div class="v" id="kPrice">—</div><div class="s" id="kAsOf">—</div></div>
      <div class="kpi-card"><div class="l">Değişim</div><div class="v" id="kChg">—</div><div class="s">Dönem (ilk→son)</div></div>
      <div class="kpi-card"><div class="l">Bar</div><div class="v" id="kBars">—</div><div class="s" id="kRange">—</div></div>
    </div>

    <div class="shell">
      <div id="chart"></div>
      <div class="overlay show" id="ov">
        <div class="spin" id="spin"></div>
        <div class="t" id="ovT">Hazır</div>
        <div class="m" id="ovM">Sembol yaz → Yükle. TradingView penceresi yok; Nexora motoru çizer.</div>
      </div>
    </div>

    <div class="note">
      <strong style="color:#cbd5e1">Not:</strong> Veriler gecikmeli olabilir. Kapalı sezonda son bar gösterilir.
      Aralık değişince grafik sıfırdan kurulur. Yatırım tavsiyesi değildir.
    </div>
  </main>

  <!-- Sıra önemli -->
  <script src="assets/js/secrets.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/engine.js"></script>
  <script>
(function () {
  "use strict";
  var range = "3mo";
  var busy = false;
  var $ = function (id) { return document.getElementById(id); };

  function ov(kind, t, m) {
    $("ov").classList.add("show");
    $("spin").style.display = kind === "load" ? "block" : "none";
    $("ovT").textContent = t;
    $("ovM").textContent = m || "";
  }
  function hide() { $("ov").classList.remove("show"); }

  function money(n) {
    if (n == null || !isFinite(n)) return "—";
    return Number(n).toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function when(sec) {
    try {
      return new Date(sec * 1000).toLocaleString("tr-TR", {
        day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit"
      });
    } catch (e) { return "—"; }
  }

  async function load() {
    if (busy) return;
    if (!window.NexoraEngine) {
      ov("err", "Motor yok", "assets/js/engine.js yüklenemedi.");
      return;
    }
    var symbol = ($("sym").value || "").trim().toUpperCase();
    if (!symbol) {
      ov("err", "Sembol gerekli", "Örnek: THYAO, GARAN, AAPL");
      return;
    }
    busy = true;
    $("btn").disabled = true;
    ov("load", "Yükleniyor", symbol + " · " + range);

    try {
      NexoraEngine.destroy();
      var info = await NexoraEngine.render($("chart"), symbol, range, { height: Math.min(window.innerHeight * 0.55, 520) });
      var chg = info.first && info.last
        ? ((info.last.close - info.first.close) / info.first.close) * 100
        : 0;
      $("kSym").textContent = symbol;
      $("kSrc").textContent = "Kaynak: " + (info.source || "—");
      $("kPrice").textContent = money(info.last.close);
      $("kAsOf").textContent = "Bar: " + when(info.last.time);
      $("kChg").textContent = (chg > 0 ? "+" : "") + chg.toFixed(2) + "%";
      $("kChg").className = "v " + (chg > 0 ? "up" : chg < 0 ? "down" : "");
      $("kBars").textContent = String(info.count);
      $("kRange").textContent = range.toUpperCase();
      hide();
      try {
        var u = new URL(location.href);
        u.searchParams.set("s", symbol);
        history.replaceState(null, "", u.pathname + u.search);
      } catch (e) {}
    } catch (err) {
      ov("err", "Grafik yüklenemedi", (err && err.message) || "Sembol / ağ hatası. THYAO veya AAPL dene.");
      $("kPrice").textContent = "—";
      $("kChg").textContent = "—";
      $("kBars").textContent = "—";
    } finally {
      busy = false;
      $("btn").disabled = false;
    }
  }

  $("ranges").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-r]");
    if (!b) return;
    $("ranges").querySelectorAll("button").forEach(function (x) { x.classList.remove("on"); });
    b.classList.add("on");
    range = b.getAttribute("data-r");
    if (($("sym").value || "").trim()) load();
  });
  $("btn").addEventListener("click", load);
  $("sym").addEventListener("keydown", function (e) { if (e.key === "Enter") load(); });

  var q = "";
  try { q = new URL(location.href).searchParams.get("s") || ""; } catch (e) {}
  if (q) {
    $("sym").value = q.replace(/\.IS$/i, "");
    load();
  } else {
    ov("idle", "Ultra grafik hazır", "Sembol gir → Yükle. Nexora motoru · TV widget yok.");
    $("spin").style.display = "none";
  }
})();
  </script>
</body>
</html>
